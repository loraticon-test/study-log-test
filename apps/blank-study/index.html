<script type="text/babel">
const { useCallback, useEffect, useMemo, useRef, useState } = React;

const LS_CONFIG = 'cozy_blank_study_config';
const LS_THEME = 'cozy_blank_study_theme';
const LS_DARK = 'cozy_blank_study_dark';

const THEMES = {
    latte:   { id:'latte',   name:'카페 라떼', hex:'#A67B5B', hoverHex:'#8B664B', title:'#5C3A21', surface:'#FDFBF7', soft:'#F4F0EA', border:'#EBE8DE', muted:'#D1CBBF', tint:'#FDF8F1' },
    matcha:  { id:'matcha',  name:'말차 라떼', hex:'#849F71', hoverHex:'#738C62', title:'#425B37', surface:'#FBFDF8', soft:'#EEF4E9', border:'#E4EBDC', muted:'#BBC8AD', tint:'#F6FAF1' },
    choco:   { id:'choco',   name:'초코 라떼', hex:'#5C3A21', hoverHex:'#4A2E1A', title:'#3D291C', surface:'#FCF8F3', soft:'#F4ECE4', border:'#E8DDD2', muted:'#C7B4A2', tint:'#FFF6EA' },
    berry:   { id:'berry',   name:'딸기 라떼', hex:'#D98891', hoverHex:'#C2737D', title:'#8F4F58', surface:'#FFF8F9', soft:'#FCECEF', border:'#F2DEE2', muted:'#D9AEB5', tint:'#FFF4F5' },
    milkTea: { id:'milkTea', name:'밀크티',    hex:'#D4A373', hoverHex:'#B88B5E', title:'#7B5738', surface:'#FFF9F1', soft:'#F7ECDD', border:'#EEDCC6', muted:'#D8B98E', tint:'#FFF7E8' },
    blue:    { id:'blue',    name:'블루라떼',  hex:'#79ABC2', hoverHex:'#6395AC', title:'#365D70', surface:'#F8FCFE', soft:'#EAF5FA', border:'#D8EAF2', muted:'#AAC8D6', tint:'#F1F9FC' },
};

const normalizeThemeId = (value) => value === 'earlgrey' ? 'milkTea' : value;
const readThemeId = () => {
    try {
        const params = new URLSearchParams(window.location.search);
        const fromUrl = normalizeThemeId(params.get('colorTheme') || params.get('palette') || '');
        const fromApp = normalizeThemeId(localStorage.getItem(LS_THEME) || sessionStorage.getItem(LS_THEME) || '');
        let sharedValue = '';
        try {
            sharedValue = JSON.parse(localStorage.getItem('nyan_clock_theme') || sessionStorage.getItem('nyan_clock_theme') || 'null') || '';
        } catch {
            sharedValue = localStorage.getItem('nyan_clock_theme') || sessionStorage.getItem('nyan_clock_theme') || '';
        }
        const fromShared = normalizeThemeId(sharedValue);
        return [fromUrl, fromApp, fromShared].find(id => THEMES[id]) || 'latte';
    } catch {
        return 'latte';
    }
};

const clean = (value) => (value || '').trim();
const mask = (value) => {
    const text = clean(value);
    if (!text) return '';
    if (text.length <= 10) return text;
    return `${text.slice(0, 5)}...${text.slice(-5)}`;
};
const normalizeId = (id) => String(id || '').replace(/-/g, '');

const loadConfig = () => {
    const fallback = { proxyUrl:'', apiKey:'', blankDbId:'', subjectDbId:'', vocabDbId:'', saved:false };
    try {
        const params = new URLSearchParams(window.location.search);
        const proxyUrl = clean(params.get('proxy') || params.get('proxyUrl'));
        const apiKey = clean(params.get('key') || params.get('apiKey'));
        const blankDbId = clean(params.get('blank') || params.get('blankDbId') || params.get('blankStudyDbId') || params.get('db') || params.get('databaseId'));
        const subjectDbId = clean(params.get('subject') || params.get('subjectDbId'));
        const vocabDbId = clean(params.get('vocab') || params.get('vocabDbId'));
        if (proxyUrl && apiKey && blankDbId) {
            const urlConfig = { proxyUrl, apiKey, blankDbId, subjectDbId, vocabDbId, saved:true, fromUrl:true };
            localStorage.setItem(LS_CONFIG, JSON.stringify(urlConfig));
            return urlConfig;
        }
        return JSON.parse(localStorage.getItem(LS_CONFIG)) || fallback;
    } catch {
        return fallback;
    }
};

const SaveIcon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
const SettingsIcon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.66.16 1.15.73 1.15 1.41v.18c0 .68-.49 1.25-1.15 1.41z"/></svg>;

const SunIcon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>;
const RefreshIcon = () => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>;
const CheckIcon = () => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
const CloseIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
const SpinnerIcon = () => <svg className="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M21 12a9 9 0 0 1-9 9"/></svg>;
const BookIcon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>;

const getRichText = (text) => [{ type: 'text', text: { content: text } }];
const splitForNotion = (text) => {
    const chunks = [];
    const normalized = text.replace(/\r\n/g, '\n').trim();
    let remaining = normalized;
    while (remaining.length > 0) {
        chunks.push(remaining.slice(0, 1800));
        remaining = remaining.slice(1800);
    }
    return chunks.length ? chunks : [''];
};

const formatLocalDate = (date) => {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
};

const buildParagraphBlocks = (text) => {
    const lines = text.replace(/\r\n/g, '\n').split('\n');
    const blocks = [];
    let buffer = [];
    const flush = () => {
        const paragraph = buffer.join('\n').trim();
        if (paragraph) {
            splitForNotion(paragraph).forEach(chunk => {
                blocks.push({
                    object: 'block',
                    type: 'paragraph',
                    paragraph: { rich_text: getRichText(chunk) }
                });
            });
        }
        buffer = [];
    };
    lines.forEach(line => {
        if (line.trim() === '') flush();
        else buffer.push(line);
    });
    flush();
    return blocks;
};

const App = () => {
    const [isDark, setIsDark] = useState(() => localStorage.getItem(LS_DARK) === 'true');
    const [themeId, setThemeId] = useState(readThemeId);
    const theme = THEMES[themeId] || THEMES.latte;
    const themeVars = {
        '--theme-color': theme.hex,
        '--theme-hover': theme.hoverHex,
        '--theme-title': theme.title,
        '--theme-surface': theme.surface,
        '--theme-soft': theme.soft,
        '--theme-border': theme.border,
        '--theme-muted': theme.muted,
        '--theme-tint': theme.tint,
    };

    const [config, setConfig] = useState(loadConfig());
    const [setupForm, setSetupForm] = useState(() => loadConfig());
    const [showSetup, setShowSetup] = useState(() => !loadConfig().saved);
    const [dbSchema, setDbSchema] = useState(null);
    const [vocabSchema, setVocabSchema] = useState(null);
    const [subjects, setSubjects] = useState([]);
    const [isLoading, setIsLoading] = useState(false);
    const [isLoadingWords, setIsLoadingWords] = useState(false);
    const [isSaving, setIsSaving] = useState(false);
    const [toast, setToast] = useState(null);
    const [concept, setConcept] = useState('');
    const [subjectId, setSubjectId] = useState('');
    const [content, setContent] = useState('');
    const [wordSearch, setWordSearch] = useState('');
    const [wordCandidates, setWordCandidates] = useState([]);
    const [selectedWordIds, setSelectedWordIds] = useState([]);
    const [lastSavedPage, setLastSavedPage] = useState(null);
    const [showClearConfirm, setShowClearConfirm] = useState(false);
    const toastTimer = useRef(null);

    const showToast = useCallback((message, type = 'success') => {
        window.clearTimeout(toastTimer.current);
        setToast({ message, type });
        toastTimer.current = window.setTimeout(() => setToast(null), 2600);
    }, []);

    useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        localStorage.setItem(LS_DARK, isDark ? 'true' : 'false');
    }, [isDark]);

    useEffect(() => {
        try { localStorage.setItem(LS_THEME, themeId); } catch {}
        try { sessionStorage.setItem(LS_THEME, themeId); } catch {}
        try { localStorage.setItem('nyan_clock_theme', JSON.stringify(themeId)); } catch {}
    }, [themeId]);

    const notionFetch = useCallback(async (path, options = {}) => {
        const { proxyUrl, apiKey } = config;
        if (!proxyUrl || !apiKey) throw new Error('설정이 필요합니다.');
        const res = await fetch(`${proxyUrl}${path}`, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': apiKey,
                'x-notion-version': '2022-06-28',
                ...(options.headers || {}),
            },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || `Notion API 오류 (${res.status})`);
        return data;
    }, [config]);

    const titlePropName = useMemo(() => {
        const props = dbSchema?.properties || {};
        return Object.keys(props).find(key => props[key].type === 'title') || '이름';
    }, [dbSchema]);

    const subjectPropName = useMemo(() => {
        const props = dbSchema?.properties || {};
        const relationKeys = Object.keys(props).filter(key => props[key].type === 'relation');
        return relationKeys.find(key => config.subjectDbId && normalizeId(props[key].relation?.database_id) === normalizeId(config.subjectDbId))
            || (props['과목']?.type === 'relation' ? '과목' : null)
            || relationKeys.find(key => key.includes('과목'))
            || relationKeys[0]
            || null;
    }, [dbSchema, config.subjectDbId]);

    const datePropName = useMemo(() => {
        const props = dbSchema?.properties || {};
        return (props['날짜']?.type === 'date' ? '날짜' : null)
            || Object.keys(props).find(key => key.includes('날짜') && props[key].type === 'date')
            || null;
    }, [dbSchema]);

    const relatedWordPropName = useMemo(() => {
        const props = dbSchema?.properties || {};
        const relationKeys = Object.keys(props).filter(key => props[key].type === 'relation');
        return relationKeys.find(key => config.vocabDbId && normalizeId(props[key].relation?.database_id) === normalizeId(config.vocabDbId))
            || relationKeys.find(key => key.includes('관련') && key.includes('단어'))
            || relationKeys.find(key => key.includes('단어'))
            || null;
    }, [dbSchema, config.vocabDbId]);

    const vocabTitlePropName = useMemo(() => {
        const props = vocabSchema?.properties || {};
        return Object.keys(props).find(key => props[key].type === 'title') || null;
    }, [vocabSchema]);

    const vocabSubjectPropName = useMemo(() => {
        const props = vocabSchema?.properties || {};
        const relationKeys = Object.keys(props).filter(key => props[key].type === 'relation');
        return relationKeys.find(key => config.subjectDbId && normalizeId(props[key].relation?.database_id) === normalizeId(config.subjectDbId))
            || (props['과목']?.type === 'relation' ? '과목' : null)
            || relationKeys.find(key => key.includes('과목'))
            || null;
    }, [vocabSchema, config.subjectDbId]);

    const loadSubjects = useCallback(async () => {
        if (!config.saved || !config.subjectDbId) {
            setSubjects([]);
            return;
        }
        const res = await notionFetch(`/v1/databases/${config.subjectDbId}/query`, {
            method: 'POST',
            body: JSON.stringify({ page_size: 100 })
        });
        const map = {};
        res.results.forEach(page => {
            const titleProp = Object.values(page.properties || {}).find(prop => prop.type === 'title');
            const name = titleProp?.title?.[0]?.plain_text || '이름 없음';
            const parentProp = page.properties?.['상위 항목'];
            const parentId = parentProp?.type === 'relation' && parentProp.relation?.[0]?.id ? parentProp.relation[0].id : null;
            map[page.id] = { id: page.id, name, parentId, parentName: null };
        });
        Object.values(map).forEach(item => {
            if (item.parentId && map[item.parentId]) item.parentName = map[item.parentId].name;
        });
        setSubjects(Object.values(map).sort((a, b) => {
            const left = `${a.parentName || ''} ${a.name}`;
            const right = `${b.parentName || ''} ${b.name}`;
            return left.localeCompare(right, 'ko');
        }));
    }, [config, notionFetch]);

    const loadInitialData = useCallback(async () => {
        if (!config.saved || !config.blankDbId) return;
        setIsLoading(true);
        try {
            const schema = await notionFetch(`/v1/databases/${config.blankDbId}`, { method: 'GET' });
            setDbSchema(schema);
            if (config.vocabDbId) {
                const vSchema = await notionFetch(`/v1/databases/${config.vocabDbId}`, { method: 'GET' });
                setVocabSchema(vSchema);
            } else {
                setVocabSchema(null);
            }
            await loadSubjects();
        } catch (error) {
            showToast(error.message || '연결 정보를 확인해주세요.', 'error');
        } finally {
            setIsLoading(false);
        }
    }, [config, notionFetch, loadSubjects, showToast]);

    useEffect(() => {
        loadInitialData();
    }, [loadInitialData]);

    const saveConfig = () => {
        const next = {
            proxyUrl: clean(setupForm.proxyUrl),
            apiKey: clean(setupForm.apiKey),
            blankDbId: clean(setupForm.blankDbId),
            subjectDbId: clean(setupForm.subjectDbId),
            vocabDbId: clean(setupForm.vocabDbId),
            saved: true,
        };
        if (!next.proxyUrl || !next.apiKey || !next.blankDbId) {
            showToast('필수 연결값을 입력해주세요.', 'error');
            return;
        }
        localStorage.setItem(LS_CONFIG, JSON.stringify(next));
        setConfig(next);
        setShowSetup(false);
        showToast('설정이 저장되었습니다.');
    };

    const resetForm = () => {
        setConcept('');
        setSubjectId('');
        setContent('');
        setWordSearch('');
        setWordCandidates([]);
        setSelectedWordIds([]);
        setLastSavedPage(null);
        setShowClearConfirm(false);
    };

    useEffect(() => {
        setWordCandidates([]);
        setSelectedWordIds([]);
    }, [subjectId]);

    const loadRelatedWords = async () => {
        if (!config.vocabDbId) {
            showToast('단어장 DB 연결이 필요합니다.', 'error');
            return;
        }
        if (!subjectId) {
            showToast('과목을 먼저 선택해주세요.', 'error');
            return;
        }
        if (!vocabSchema) {
            showToast('단어장 DB 정보를 불러오는 중입니다.', 'error');
            return;
        }

        const filters = [];
        if (vocabSubjectPropName) {
            filters.push({ property: vocabSubjectPropName, relation: { contains: subjectId } });
        }
        if (wordSearch.trim() && vocabTitlePropName) {
            filters.push({ property: vocabTitlePropName, title: { contains: wordSearch.trim() } });
        }
        const body = { page_size: 50, sorts: [{ timestamp: 'created_time', direction: 'descending' }] };
        if (filters.length === 1) body.filter = filters[0];
        if (filters.length > 1) body.filter = { and: filters };

        setIsLoadingWords(true);
        try {
            const res = await notionFetch(`/v1/databases/${config.vocabDbId}/query`, {
                method: 'POST',
                body: JSON.stringify(body)
            });
            const words = (res.results || []).map(page => {
                const titleProp = Object.values(page.properties || {}).find(prop => prop.type === 'title');
                const title = titleProp?.title?.[0]?.plain_text || '이름 없는 단어';
                return { id: page.id, title };
            });
            setWordCandidates(words);
            if (words.length === 0) showToast('불러온 관련 단어가 없습니다.', 'error');
        } catch (error) {
            showToast(error.message || '관련 단어를 불러오지 못했습니다.', 'error');
        } finally {
            setIsLoadingWords(false);
        }
    };

    const toggleWord = (wordId) => {
        setSelectedWordIds(prev => prev.includes(wordId) ? prev.filter(id => id !== wordId) : [...prev, wordId]);
    };

    const saveBlankStudy = async () => {
        const title = concept.trim();
        const answer = content.trim();
        if (!config.saved || !config.blankDbId) {
            setShowSetup(true);
            showToast('연결 설정이 필요합니다.', 'error');
            return;
        }
        if (!title) {
            showToast('개념 이름을 입력해주세요.', 'error');
            return;
        }
        if (!subjectId) {
            showToast('과목을 선택해주세요.', 'error');
            return;
        }
        if (!answer) {
            showToast('설명을 작성해주세요.', 'error');
            return;
        }
        if (!dbSchema) {
            showToast('DB 정보를 불러오는 중입니다.', 'error');
            return;
        }
        if (selectedWordIds.length > 0 && !relatedWordPropName) {
            showToast('백지학습 DB의 관련 단어 관계형 속성을 확인해주세요.', 'error');
            return;
        }
        const properties = {
            [titlePropName]: { title: getRichText(title) }
        };
        if (subjectPropName) {
            properties[subjectPropName] = { relation: [{ id: subjectId }] };
        }
        if (datePropName) {
            properties[datePropName] = { date: { start: formatLocalDate(new Date()) } };
        }
        if (relatedWordPropName && selectedWordIds.length > 0) {
            properties[relatedWordPropName] = { relation: selectedWordIds.map(id => ({ id })) };
        }
        const children = buildParagraphBlocks(answer);
        setIsSaving(true);
        try {
            const page = await notionFetch('/v1/pages', {
                method: 'POST',
                body: JSON.stringify({
                    parent: { database_id: config.blankDbId },
                    properties,
                    children
                })
            });
            setLastSavedPage(page);
            showToast('백지학습이 저장되었습니다.');
            setConcept('');
            setContent('');
            setSelectedWordIds([]);
        } catch (error) {
            showToast(error.message || '저장에 실패했습니다.', 'error');
        } finally {
            setIsSaving(false);
        }
    };

    const selectedSubject = subjects.find(item => item.id === subjectId);
    const notionUrl = lastSavedPage?.id ? `https://www.notion.so/${lastSavedPage.id.replace(/-/g, '')}` : '';
    const connected = !!config.saved && !!config.proxyUrl && !!config.apiKey && !!config.blankDbId;
    const isUrlConnected = !!(config.fromUrl || config.fromInstall);
    const maskValue = (value) => {
        if (!value) return '연결 대기';
        const text = String(value);
        if (text.length <= 10) return text;
        return `${text.slice(0, 6)}...${text.slice(-4)}`;
    };
    const getConnectionStatus = (kind, isConnected) => {
        if (isConnected) return { label: '연결됨', className: 'text-emerald-600 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-400/10 border-emerald-100 dark:border-emerald-400/20', dot: 'bg-emerald-400' };
        return { label: kind === 'required' ? '필수 누락' : '미연결', className: kind === 'required' ? 'text-red-500 dark:text-red-300 bg-red-50 dark:bg-red-400/10 border-red-100 dark:border-red-400/20' : 'text-gray-400 dark:text-gray-300 bg-gray-50 dark:bg-white/5 border-gray-100 dark:border-white/10', dot: kind === 'required' ? 'bg-red-400' : 'bg-gray-300' };
    };
    const connectionRows = [
        { icon: '🔗', label: 'URL 파라미터', desc: isUrlConnected ? '임베드 URL로 설정값을 불러오고 있습니다.' : 'proxy / key / blank 값이 URL에 필요합니다.', status: getConnectionStatus('required', isUrlConnected) },
        { icon: '📝', label: '백지학습 DB', desc: config.blankDbId ? maskValue(config.blankDbId) : '백지학습 내용을 저장하는 필수 DB입니다.', status: getConnectionStatus('required', Boolean(config.blankDbId)) },
        { icon: '📚', label: '과목 DB', desc: config.subjectDbId ? maskValue(config.subjectDbId) : '과목 선택에 사용하는 선택 DB입니다.', status: getConnectionStatus('optional', Boolean(config.subjectDbId)) },
        { icon: '🔤', label: '단어장 DB', desc: config.vocabDbId ? maskValue(config.vocabDbId) : '관련 단어 선택에 사용하는 선택 DB입니다.', status: getConnectionStatus('optional', Boolean(config.vocabDbId)) },
    ];

    return (
        <div className="theme-scope blank-shell theme-card-surface bg-white dark:bg-[#252525] border border-latte-100 dark:border-[#2F2F2F] rounded-[2rem] p-6 shadow-sm my-4 animate-fade-in" style={themeVars}>
            <div className="flex items-start justify-between gap-3 mb-5">
                <div className="min-w-0">
                    <div className="inline-flex items-center gap-2 text-[11px] font-extrabold tracking-[0.16em] text-[#9CA3AF] uppercase mb-1">
                        <BookIcon /> Blank Study
                    </div>
                    <h1 className="text-[26px] leading-tight font-extrabold text-[#1F2937]">백지학습</h1>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                    <button onClick={loadInitialData} className="w-9 h-9 rounded-full bg-latte-50 dark:bg-[#333333] text-latte-700 dark:text-gray-200 flex items-center justify-center hover:bg-latte-100 dark:hover:bg-[#3D3D3D] transition-colors" title="새로고침" disabled={isLoading}>
                        {isLoading ? <SpinnerIcon /> : <RefreshIcon />}
                    </button>
                    <button onClick={() => setIsDark(prev => !prev)} className="w-9 h-9 rounded-full bg-latte-50 dark:bg-[#333333] text-latte-700 dark:text-gray-200 flex items-center justify-center hover:bg-latte-100 dark:hover:bg-[#3D3D3D] transition-colors" title="테마 전환">
                        {isDark ? <SunIcon /> : <MoonIcon />}
                    </button>
                    <button onClick={() => setShowSetup(prev => !prev)} className="w-9 h-9 rounded-full bg-latte-500 text-white flex items-center justify-center hover:bg-latte-700 transition-colors" title="설정">
                        <SettingsIcon />
                    </button>
                </div>
            </div>

            {showSetup && (
                <div className="theme-card-tint rounded-2xl border border-latte-100 dark:border-[#3D3D3D] bg-[#FDF8F1] dark:bg-[#1E1E1E] p-4 mb-5">
                    <div className="flex items-center justify-between gap-3 mb-4">
                        <div>
                            <p className="text-sm font-extrabold text-gray-700 dark:text-gray-100">연결 설정</p>
                            <p className="text-[11px] font-bold text-gray-400 dark:text-gray-500 mt-0.5">proxy, key, blank DB, subject DB</p>
                        </div>
                        <span className={`text-[10px] font-extrabold rounded-full px-2.5 py-1 border ${connected ? 'text-emerald-600 bg-white border-emerald-100 dark:bg-emerald-400/10 dark:text-emerald-300 dark:border-emerald-400/20' : 'text-gray-400 bg-white border-gray-100 dark:bg-white/5 dark:border-white/10'}`}>
                            {connected ? '연결됨' : '대기'}
                        </span>
                    </div>
                    <div className={`rounded-2xl border p-4 mb-4 ${connected ? 'border-emerald-100 bg-emerald-50/70 dark:bg-emerald-400/10 dark:border-emerald-400/20' : 'border-red-100 bg-red-50/80 dark:bg-red-400/10 dark:border-red-400/20'}`}>
                        <div className="flex items-start gap-3">
                            <div className={`w-9 h-9 rounded-full bg-white dark:bg-[#252525] flex items-center justify-center font-black shadow-sm ${connected ? 'text-emerald-500 dark:text-emerald-300' : 'text-red-400 dark:text-red-300'}`}>
                                {connected ? <CheckIcon/> : '!'}
                            </div>
                            <div className="min-w-0">
                                <p className={`text-sm font-extrabold ${connected ? 'text-emerald-700 dark:text-emerald-300' : 'text-red-500 dark:text-red-300'}`}>
                                    {connected ? (isUrlConnected ? 'URL로 연결됨' : '저장된 설정으로 연결됨') : 'URL 파라미터가 필요합니다'}
                                </p>
                                <p className={`text-[12px] leading-relaxed mt-1 ${connected ? 'text-emerald-600 dark:text-emerald-200/80' : 'text-red-500/80 dark:text-red-300/80'}`}>
                                    {connected ? '설정값은 페이지 안에 다시 입력하지 않고, 임베드 URL에서 자동으로 읽어옵니다.' : '위젯 링크에 proxy, key, blank 값을 포함해주세요.'}
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="space-y-2.5 mb-4">
                        {connectionRows.map(row => (
                            <div key={row.label} className="flex items-center gap-3 rounded-2xl border border-gray-100 dark:border-[#2F2F2F] bg-white dark:bg-[#252525] p-3">
                                <div className="w-9 h-9 rounded-xl bg-gray-50 dark:bg-[#1E1E1E] flex items-center justify-center text-lg shadow-sm shrink-0">{row.icon}</div>
                                <div className="min-w-0 flex-1">
                                    <div className="flex items-center justify-between gap-2">
                                        <p className="text-[13px] font-extrabold text-gray-700 dark:text-gray-100 truncate">{row.label}</p>
                                        <span className={`inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-[10px] font-extrabold whitespace-nowrap ${row.status.className}`}>
                                            <span className={`w-1.5 h-1.5 rounded-full ${row.status.dot}`}></span>{row.status.label}
                                        </span>
                                    </div>
                                    <p className="text-[11px] text-gray-400 dark:text-gray-400 truncate mt-0.5">{row.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="hidden">
                        <input value={setupForm.proxyUrl || ''} onChange={e => setSetupForm(prev => ({ ...prev, proxyUrl:e.target.value }))} className="theme-focus rounded-xl border border-latte-100 dark:border-[#333333] bg-white dark:bg-[#252525] px-3 py-3 text-sm font-bold text-gray-700 dark:text-gray-100 outline-none" placeholder="Proxy URL" />
                        <input value={setupForm.apiKey || ''} onChange={e => setSetupForm(prev => ({ ...prev, apiKey:e.target.value }))} className="theme-focus rounded-xl border border-latte-100 dark:border-[#333333] bg-white dark:bg-[#252525] px-3 py-3 text-sm font-bold text-gray-700 dark:text-gray-100 outline-none" placeholder="API Key" />
                        <input value={setupForm.blankDbId || ''} onChange={e => setSetupForm(prev => ({ ...prev, blankDbId:e.target.value }))} className="theme-focus rounded-xl border border-latte-100 dark:border-[#333333] bg-white dark:bg-[#252525] px-3 py-3 text-sm font-bold text-gray-700 dark:text-gray-100 outline-none" placeholder="백지학습 DB ID" />
                        <input value={setupForm.subjectDbId || ''} onChange={e => setSetupForm(prev => ({ ...prev, subjectDbId:e.target.value }))} className="theme-focus rounded-xl border border-latte-100 dark:border-[#333333] bg-white dark:bg-[#252525] px-3 py-3 text-sm font-bold text-gray-700 dark:text-gray-100 outline-none" placeholder="과목 DB ID" />
                        <input value={setupForm.vocabDbId || ''} onChange={e => setSetupForm(prev => ({ ...prev, vocabDbId:e.target.value }))} className="theme-focus rounded-xl border border-latte-100 dark:border-[#333333] bg-white dark:bg-[#252525] px-3 py-3 text-sm font-bold text-gray-700 dark:text-gray-100 outline-none" placeholder="단어장 DB ID" />
                    </div>
                    <div className="mt-4 flex flex-wrap items-center justify-between gap-3">
                        <div className="flex items-center gap-2">
                            {Object.values(THEMES).map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setThemeId(item.id)}
                                    className="w-7 h-7 rounded-full border border-white/70 transition-transform"
                                    style={{ background:item.hex, transform: themeId === item.id ? 'scale(1.12)' : 'scale(1)', boxShadow: themeId === item.id ? `0 0 0 3px ${isDark ? '#1E1E1E' : item.surface}, 0 0 0 5px ${item.hex}` : '0 2px 8px rgba(0,0,0,0.08)' }}
                                    title={item.name}
                                />
                            ))}
                        </div>
                        <button onClick={() => setShowSetup(false)} className="inline-flex items-center justify-center gap-2 rounded-xl bg-latte-500 hover:bg-latte-700 px-4 py-3 text-sm font-extrabold text-white transition-colors">
                            <CheckIcon /> 닫기
                        </button>
                    </div>
                </div>
            )}

            {!showSetup && (
                <div className="grid gap-4">
                    <div className="grid grid-cols-1 sm:grid-cols-[1fr_1.2fr] gap-3">
                        <label className="block">
                            <span className="block text-[12px] font-extrabold text-gray-500 dark:text-gray-300 mb-1.5">과목</span>
                            <select value={subjectId} onChange={e => setSubjectId(e.target.value)} className="theme-focus w-full rounded-xl border border-latte-100 dark:border-[#333333] bg-white dark:bg-[#1E1E1E] px-3 py-3 text-sm font-bold text-gray-700 dark:text-gray-100 outline-none" disabled={!subjects.length}>
                                <option value="">{subjects.length ? '과목 선택' : '과목 없음'}</option>
                                {subjects.map(item => (
                                    <option key={item.id} value={item.id}>{item.parentName ? `${item.parentName} > ${item.name}` : item.name}</option>
                                ))}
                            </select>
                        </label>
                        <label className="block">
                            <span className="block text-[12px] font-extrabold text-gray-500 dark:text-gray-300 mb-1.5">개념 이름</span>
                            <input value={concept} onChange={e => setConcept(e.target.value)} className="theme-focus w-full rounded-xl border border-latte-100 dark:border-[#333333] bg-white dark:bg-[#1E1E1E] px-3 py-3 text-sm font-bold text-gray-700 dark:text-gray-100 outline-none" placeholder="오늘 정리할 개념" />
                        </label>
                    </div>

                    <div className="rounded-2xl border border-latte-100 dark:border-[#333333] bg-latte-50/60 dark:bg-[#1E1E1E] p-3">
                        <div className="flex flex-col gap-2 sm:flex-row sm:items-end">
                            <label className="block flex-1">
                                <span className="block text-[12px] font-extrabold text-gray-500 dark:text-gray-300 mb-1.5">관련 단어</span>
                                <input value={wordSearch} onChange={e => setWordSearch(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); loadRelatedWords(); } }} className="theme-focus w-full rounded-xl border border-latte-100 dark:border-[#333333] bg-white dark:bg-[#252525] px-3 py-2.5 text-sm font-bold text-gray-700 dark:text-gray-100 outline-none" placeholder="검색어 없이 불러오면 과목 단어를 가져옵니다" />
                            </label>
                            <button type="button" onClick={loadRelatedWords} disabled={isLoadingWords || !config.vocabDbId || !subjectId} className="inline-flex h-[42px] items-center justify-center gap-2 rounded-xl bg-white dark:bg-[#252525] border border-latte-100 dark:border-[#333333] px-4 text-sm font-extrabold text-latte-700 dark:text-gray-100 hover:bg-latte-100 dark:hover:bg-[#333333] transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                {isLoadingWords ? <><SpinnerIcon /> 불러오는 중</> : '단어 불러오기'}
                            </button>
                        </div>
                        {wordCandidates.length > 0 && (
                            <div className="mt-3 flex flex-wrap gap-2">
                                {wordCandidates.map(word => {
                                    const selected = selectedWordIds.includes(word.id);
                                    return (
                                        <button
                                            type="button"
                                            key={word.id}
                                            onClick={() => toggleWord(word.id)}
                                            className={`rounded-full border px-3 py-1.5 text-[12px] font-extrabold transition-colors ${selected ? 'bg-latte-500 border-latte-500 text-white' : 'bg-white dark:bg-[#252525] border-latte-100 dark:border-[#333333] text-gray-500 dark:text-gray-300 hover:text-latte-700 hover:bg-latte-100'}`}
                                        >
                                            {word.title}
                                        </button>
                                    );
                                })}
                            </div>
                        )}
                        {selectedWordIds.length > 0 && (
                            <p className="mt-2 text-[11px] font-bold text-gray-400 dark:text-gray-500">선택된 단어 {selectedWordIds.length}개가 저장 시 함께 연결됩니다.</p>
                        )}
                    </div>

                    <label className="block">
                        <div className="flex items-center justify-between gap-3 mb-1.5">
                            <span className="block text-[12px] font-extrabold text-gray-500 dark:text-gray-300">설명</span>
                            <span className="text-[11px] font-bold text-gray-400 dark:text-gray-500">{content.trim().length.toLocaleString()}자</span>
                        </div>
                        <textarea value={content} onChange={e => setContent(e.target.value)} className="theme-focus w-full min-h-[260px] resize-y rounded-2xl border border-latte-100 dark:border-[#333333] bg-white dark:bg-[#1E1E1E] px-4 py-4 text-[15px] leading-relaxed font-medium text-gray-700 dark:text-gray-100 outline-none" placeholder="아무것도 보지 않고 설명해보세요." />
                    </label>

                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div className="min-h-[24px] text-[12px] font-bold text-gray-400 dark:text-gray-500">
                            {selectedSubject && <span>{selectedSubject.parentName ? `${selectedSubject.parentName} > ${selectedSubject.name}` : selectedSubject.name}</span>}
                            {lastSavedPage && <a href={notionUrl} target="_blank" rel="noopener noreferrer" className="ml-2 text-latte-500 hover:text-latte-700 underline underline-offset-4">저장된 페이지 열기</a>}
                        </div>
                        <div className="flex items-center gap-2">
                            <button type="button" onClick={() => setShowClearConfirm(true)} className="rounded-xl bg-gray-100 dark:bg-[#333333] px-4 py-3 text-sm font-extrabold text-gray-500 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-[#3D3D3D] transition-colors">비우기</button>
                            <button onClick={saveBlankStudy} disabled={isSaving || isLoading} className="inline-flex min-w-[132px] items-center justify-center gap-2 rounded-xl bg-latte-500 hover:bg-latte-700 px-5 py-3 text-sm font-extrabold text-white transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
                                {isSaving ? <><SpinnerIcon /> 저장 중</> : <><SaveIcon /> 저장</>}
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {toast && (
                <div className={`fixed left-1/2 top-5 z-50 -translate-x-1/2 rounded-full px-5 py-3 text-[13px] font-extrabold shadow-[0_10px_35px_rgba(0,0,0,0.16)] ${toast.type === 'error' ? 'bg-[#E56B6F] text-white' : 'bg-gray-800 text-white'}`}>
                    {toast.message}
                </div>
            )}

            {showClearConfirm && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-[2px]">
                    <div role="dialog" aria-modal="true" aria-labelledby="clear-dialog-title" className="bg-white dark:bg-[#252525] rounded-3xl w-full max-w-sm p-6 shadow-2xl relative">
                        <button type="button" onClick={() => setShowClearConfirm(false)} className="absolute top-4 right-4 p-1 text-gray-400 dark:text-gray-500 hover:bg-gray-100 dark:hover:bg-[#333333] rounded-full transition" aria-label="닫기">
                            <CloseIcon />
                        </button>
                        <h3 id="clear-dialog-title" className="text-xl font-bold text-gray-800 dark:text-gray-100 mb-2">작성 내용 비우기</h3>
                        <p className="text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-6">작성한 개념, 과목, 설명과 선택한 관련 단어가 모두 지워집니다. 정말 비우시겠어요?</p>
                        <div className="flex gap-2">
                            <button type="button" onClick={() => setShowClearConfirm(false)} className="flex-1 bg-gray-100 dark:bg-[#333333] text-gray-600 dark:text-gray-200 font-bold py-3.5 rounded-xl hover:bg-gray-200 dark:hover:bg-[#3D3D3D] transition-colors">취소</button>
                            <button type="button" onClick={resetForm} className="flex-1 bg-[#E56B6F] text-white font-bold py-3.5 rounded-xl hover:bg-[#D85B60] transition-colors shadow-sm">모두 비우기</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

Promise.resolve(window.STUDY_INSTALL_READY).finally(() => ReactDOM.createRoot(document.getElementById('root')).render(<App />));
</script>
<script>
if ('serviceWorker' in navigator && ['https:', 'http:'].includes(window.location.protocol)) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
}
</script>
</body>
</html>
